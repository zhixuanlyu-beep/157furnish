<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1250" viewBox="0 0 1800 1250" data-revision="R2" data-layout-sha256="668e39924f6c4857e320cb33a8b92d7e261b9c682babee755a253c7963718394">
<rect x="0.0000" y="0.0000" width="1800.0000" height="1250.0000" fill="#fcfbf6" stroke="none" stroke-width="1" />
<text x="45.000" y="48.000" font-size="22" fill="#576858" font-family="Microsoft YaHei, sans-serif">157FURNISH  /  R2</text>
<text x="45.000" y="100.000" font-size="34" fill="#263c34" font-family="Microsoft YaHei, sans-serif">01 原始尺寸基线 / 尺寸链与假设分离</text>
<polyline points="45.000,119.000 1755.000,119.000" fill="none" stroke="#456653" stroke-width="2"/>
<text x="45.000" y="1208.000" font-size="18" fill="#263c34" font-family="Microsoft YaHei, sans-serif">毫米 · X东 Y北 · 概念深化，非施工/下单图 · 仅二维图，无三维渲染</text>
<text x="45.000" y="1232.000" font-size="14" fill="#263c34" font-family="Microsoft YaHei, sans-serif">布局 SHA256 668e39924f6c4857e320cb33a8b92d7e261b9c682babee755a253c7963718394</text>
<text x="1380.000" y="172.000" font-size="22" fill="#263c34" font-family="Microsoft YaHei, sans-serif">读图与条件</text>
<text x="1380.000" y="212.000" font-size="17" fill="#263c34" font-family="Microsoft YaHei, sans-serif">1. 图中标注面积仅抄录，不校准几何，更</text>
<text x="1380.000" y="241.000" font-size="17" fill="#263c34" font-family="Microsoft YaHei, sans-serif">不能从项目名157推算面积。</text>
<text x="1380.000" y="286.000" font-size="17" fill="#263c34" font-family="Microsoft YaHei, sans-serif">2. 原图用于房间拓扑及尺寸链；洞口、墙</text>
<text x="1380.000" y="315.000" font-size="17" fill="#263c34" font-family="Microsoft YaHei, sans-serif">厚和家具定位不按像素换算。</text>
<text x="1380.000" y="360.000" font-size="17" fill="#263c34" font-family="Microsoft YaHei, sans-serif">3. 西南凹凸角高度1400和宽1800</text>
<text x="1380.000" y="389.000" font-size="17" fill="#263c34" font-family="Microsoft YaHei, sans-serif">为概念假设；外包链保持。</text>
<text x="1380.000" y="434.000" font-size="17" fill="#263c34" font-family="Microsoft YaHei, sans-serif">4. 门框净宽按名义洞宽减60；卫生间B</text>
<text x="1380.000" y="463.000" font-size="17" fill="#263c34" font-family="Microsoft YaHei, sans-serif">及储物间推拉门挂轨/可封闭性现场确认。</text>
<text x="1380.000" y="508.000" font-size="17" fill="#263c34" font-family="Microsoft YaHei, sans-serif">5. 原阳台经客厅开口按推拉门研究；原结</text>
<text x="1380.000" y="537.000" font-size="17" fill="#263c34" font-family="Microsoft YaHei, sans-serif">构与门槛高度待核。</text>
<text x="1380.000" y="582.000" font-size="17" fill="#263c34" font-family="Microsoft YaHei, sans-serif">6. 黑墙为R1原始概念边界，非实测。</text>
<text x="1380.000" y="627.000" font-size="17" fill="#263c34" font-family="Microsoft YaHei, sans-serif">7. 总宽15077，总深10074。</text>
