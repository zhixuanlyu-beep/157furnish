<text x="45.000" y="1232.000" font-size="14" fill="#263c34" font-family="Microsoft YaHei, sans-serif">布局 SHA256 668e39924f6c4857e320cb33a8b92d7e261b9c682babee755a253c7963718394</text>
<text x="1380.000" y="172.000" font-size="22" fill="#263c34" font-family="Microsoft YaHei, sans-serif">读图与条件</text>
<text x="1380.000" y="212.000" font-size="17" fill="#263c34" font-family="Microsoft YaHei, sans-serif">1. 净深1143，源于墙内侧；未实测。</text>
<text x="1380.000" y="257.000" font-size="17" fill="#263c34" font-family="Microsoft YaHei, sans-serif">2. 东灶朝西；西洗烘朝东。</text>
<text x="1380.000" y="302.000" font-size="17" fill="#263c34" font-family="Microsoft YaHei, sans-serif">3. 洗衣路线不穿过灶前。</text>
<text x="1380.000" y="347.000" font-size="17" fill="#263c34" font-family="Microsoft YaHei, sans-serif">4. 配电容量</text>
<text x="1380.000" y="392.000" font-size="17" fill="#263c34" font-family="Microsoft YaHei, sans-serif">5. 专用回路</text>
<text x="1380.000" y="437.000" font-size="17" fill="#263c34" font-family="Microsoft YaHei, sans-serif">6. 设备散热</text>
<text x="1380.000" y="482.000" font-size="17" fill="#263c34" font-family="Microsoft YaHei, sans-serif">7. 不燃灶后衬板</text>
<text x="1380.000" y="527.000" font-size="17" fill="#263c34" font-family="Microsoft YaHei, sans-serif">8. 经核实烟道接入</text>
<text x="1380.000" y="572.000" font-size="17" fill="#263c34" font-family="Microsoft YaHei, sans-serif">9. 两案均须排烟，禁止默认直排外立面。</text>
