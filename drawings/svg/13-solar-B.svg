<text x="1380.000" y="212.000" font-size="17" fill="#263c34" font-family="Microsoft YaHei, sans-serif">1. 继承北京40°N/116.5°E，</text>
<text x="1380.000" y="241.000" font-size="17" fill="#263c34" font-family="Microsoft YaHei, sans-serif">图示北。</text>
<text x="1380.000" y="286.000" font-size="17" fill="#263c34" font-family="Microsoft YaHei, sans-serif">2. 四季赤纬近似，整点枕点射线。</text>
<text x="1380.000" y="331.000" font-size="17" fill="#263c34" font-family="Microsoft YaHei, sans-serif">3. 外遮挡、玻璃透过及窗帘未知。</text>
<text x="1380.000" y="376.000" font-size="17" fill="#263c34" font-family="Microsoft YaHei, sans-serif">4. 仅作遮光窗帘与床头方向讨论，不作日</text>
<text x="1380.000" y="405.000" font-size="17" fill="#263c34" font-family="Microsoft YaHei, sans-serif">照合规。</text>
<text x="1380.000" y="450.000" font-size="17" fill="#263c34" font-family="Microsoft YaHei, sans-serif">5. 春分：穿窗时点 </text>
